{{define "login"}}
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Login &mdash; BidNow Live</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body class="bn-body">
{{template "nav" .}}
<section class="bn-page">
  <div class="bn-page-inner bn-narrow bn-center">
    <h1>Staff Login</h1>
    <p class="bn-muted">Sign in to the floor desk portal.</p>
    {{if .Error}}<p class="bn-form-error">{{.Error}}</p>{{end}}
    <form class="bn-form" action="/login" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="text" autocomplete="off" placeholder="e.g. bidder@bidnow.example">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      <button class="bn-btn-primary" type="submit">Sign in</button>
    </form>
    <p class="bn-muted bn-small">Demo bidder account: <code>bidder@bidnow.example</code> / <code>demo1234</code></p>
  </div>
</section>
{{template "foot" .}}
</body></html>
{{end}}
